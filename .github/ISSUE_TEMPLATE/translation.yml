name: Translation issue
description: 回報翻譯錯誤、用詞建議、漏翻或顯示情境問題
title: "[Translation] "
body:
  - type: input
    id: alt-version
    attributes:
      label: ALT 版本
      placeholder: 例如 1.1.1
    validations:
      required: true
  - type: input
    id: antigravity-version
    attributes:
      label: Antigravity 版本
      placeholder: 例如 2.14.0
    validations:
      required: true
  - type: textarea
    id: location
    attributes:
      label: 出現位置 / 操作路徑
      description: 說明在哪個頁面、選單、按鈕或流程看到這段文字。
    validations:
      required: true
  - type: textarea
    id: source
    attributes:
      label: 英文原文
    validations:
      required: true
  - type: textarea
    id: current
    attributes:
      label: 目前繁體中文譯文
  - type: textarea
    id: suggestion
    attributes:
      label: 建議譯文
      description: 若只是漏翻，可填希望採用的繁體中文內容。
  - type: textarea
    id: context
    attributes:
      label: 補充情境
      description: 可附截圖或說明為什麼目前譯法容易誤解。
