name: Feature request
description: 提出新功能或流程改善建議
title: "[Feature] "
body:
  - type: textarea
    id: need
    attributes:
      label: 使用情境 / 問題
      description: 說明目前遇到的限制，以及這項需求要解決什麼問題。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建議方案
      description: 說明希望新增或修改的行為。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 已考慮的替代方案
  - type: dropdown
    id: platform
    attributes:
      label: 主要平台
      options:
        - Windows
        - macOS Intel
        - macOS Apple Silicon
        - 跨平台 / 不限定
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: 其他資訊
