name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core / Ubuntu
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24.21.0

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-fund

      - name: Smoke and process-safety tests
        run: npm run check

      - name: Packaging and CI policy tests
        run: npm run check:packaging

      - name: Production dependency audit
        run: npm audit --omit=dev

  windows-x64:
    name: Windows x64 installer E2E
    runs-on: windows-2025
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24.21.0

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-fund

      - name: Build Windows x64 installers
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File .\build\windows\build.ps1 -Arch x64

      - name: Run Windows installer E2E
        run: npm run check:windows-installer

      - name: Upload Windows CI artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ci-windows-x64-${{ github.sha }}
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 3

  macos:
    name: macOS ${{ matrix.arch }} app build
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            arch: x64
          - runner: macos-15
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24.21.0

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-fund

      - name: Run smoke tests
        run: npm run check

      - name: Build macOS app
        run: ./build/macos/build.sh ${{ matrix.arch }}

      - name: Validate zipped app after extraction
        shell: bash
        run: |
          set -euo pipefail
          APP_NAME="Antigravity-ZH-Hant-TW-ALT-1.1.1-macOS-${{ matrix.arch }}.app"
          ZIP_PATH="dist/$APP_NAME.zip"
          EXTRACT_DIR=".build/ci-extract-${{ matrix.arch }}"
          rm -rf "$EXTRACT_DIR"
          mkdir -p "$EXTRACT_DIR"
          ditto -x -k "$ZIP_PATH" "$EXTRACT_DIR"
          APP_PATH="$EXTRACT_DIR/$APP_NAME"
          codesign --verify --deep --strict "$APP_PATH"
          "$APP_PATH/Contents/Resources/payload/runtime/node" --version | grep -Fx 'v24.21.0'

      - name: Upload macOS CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: ci-macos-${{ matrix.arch }}-${{ github.sha }}
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 3
